<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVA2 - Datos Personales</title>
  <link rel="stylesheet" href="/Lava2/lavadero_project/styles/styles.css">
</head>
<body class="bg">
  <div class="container">
    <h1 class="logo">LAVA2</h1>
    <h2>Vamos a completar datos</h2>
    <p>Todos los campos son obligatorios. ¡Llénalos para continuar!</p>

    <form id="personalForm">
      <!-- Upload foto perfil -->
      <div class="profile-upload">
        <div class="profile-pic">
          <img id="preview" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Foto de perfil">
        </div>
        <input type="file" id="profilePic" accept="image/*" hidden>
        <label for="profilePic" class="upload-btn">Subir Foto</label>
      </div>
        
      <div class="form-grid">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellido" placeholder="Apellido" required>

        <select id="tipoDocumento" required>
          <option value="">Tipo de Documento</option>
          <option>Cédula de Ciudadanía</option>
          <option>Tarjeta de Identidad</option>
          <option>Cédula de Extranjería</option>
          <option>Pasaporte</option>
          <option>Documento de Identidad Extranjero</option>
        </select>
        <input type="text" id="numeroDocumento" placeholder="Número de Documento" required>

        <select id="metodoPago" required>
          <option value="">Método de Pago</option>
          <option>Tarjeta de Crédito</option>
          <option>Tarjeta Débito</option>
          <option>Efectivo</option>
          <option>Transferencia Bancaria</option>
          <option>Nequi/Daviplata</option>
        </select>
        <input type="text" id="numeroCuenta" placeholder="Número de Cuenta">

        <input type="text" id="modeloMarca" placeholder="Modelo y marca del vehículo" required>
        <input type="text" id="placa" placeholder="Placa del Vehículo" required>

        <input type="text" id="tipoCarro" placeholder="Tipo de Carro" required>
        <input type="text" id="ciudad" placeholder="Ciudad" required>
        <input type="text" id="direccion" placeholder="Dirección" required>
      </div>

      <!-- Cuidado especial centrado -->
      <div class="form-group center-textarea">
        <label for="cuidadoEspecial">¿Tu vehículo requiere cuidado especial?</label>
        <textarea id="cuidadoEspecial" placeholder="Escribe aquí si tu vehículo necesita un cuidado especial..." rows="3"></textarea>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="terms">
        <label for="terms">Acepto los términos y condiciones</label>
      </div>

      <button type="submit" class="btn">Guardar Información</button>
    </form>
  </div>

  <script src="/Lava2/lavadero_project/JS/script.js"></script>
  <script>
    // JS para mostrar preview de la foto
    const fileInput = document.getElementById('profilePic');
    const previewImg = document.getElementById('preview');

    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          previewImg.src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
