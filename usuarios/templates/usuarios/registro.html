<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVA2 - Registro</title>
  <link rel="stylesheet" href="/Lava2/lavadero_project/styles/styles.css">
</head>

<body class="bg">
  <div class="container">
    <h1 class="logo">LAVA2</h1>
    <h2>Crear Cuenta</h2>
    <p>Ingresa tu email para iniciar en la app</p>

    <form id="registerForm">
      <input type="email" id="email" placeholder="email@domain.com" required>
      <input type="password" id="password" placeholder="Contraseña" required minlength="6">
      <input type="password" id="confirmPassword" placeholder="Confirmar Contraseña" required>
      <button type="submit" class="btn">Continuar</button>
    </form>

    <div class="social-login">
      <button class="btn-google">Continuar con Gmail</button>
      <button class="btn-apple">Continuar con iPhone</button>
    </div>

    <p class="terms">
      Al hacer clic en continuar, aceptas nuestros <a href="#">Términos de servicio</a> y <a href="#">Política de privacidad</a>.
    </p>

    

    <p class="login-link">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
    </p>
  </div>

  <script src="/Lava2/lavadero_project/JS/script.js"></script>
</body>
</html>
