{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-wrapper"> <!-- Reusamos la misma clase para consistencia -->
        <div class="logo-container">
            <img src="{% static 'images/logo.png' %}" alt="Logo Lavadero">
        </div>

        <h2>Crear una Cuenta</h2>

        <form method="POST">
            {% csrf_token %}
            
            <!-- El UserCreationForm es un poco diferente. 'as_p' puede funcionar,
                 pero si quieres un estilo perfecto, renderiza campo por campo -->
            {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.help_text %}
                    <small style="color: grey">{{ field.help_text }}</small>
                {% endif %}
                {% for error in field.errors %}
                    <p style="color: red">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="submit-btn">Registrarse</button>
        </form>

        <p class="switch-link">
            ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
        </p>
    </div>
        <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
